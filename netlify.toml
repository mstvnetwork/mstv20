# Shemaroo Proxy
[[redirects]]
  from = "/shemaroo/*"
  to = "https://airtelapp.shemaroo.com"
  status = 200
  force = true

# Apne.co Proxy
[[redirects]]
  from = "/apne/*"
  to = "https://apne.co"
  status = 200
  force = true

# Tulnit Proxy
[[redirects]]
  from = "/tulnit/*"
  to = "https://tulnit.com"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

