<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Edge Stream Tester</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        video { width: 100%; border-radius: 8px; background: black; margin-top: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Netlify Proxy Player</h2>
        <p>Testing: Shemaroo TV (Airtel)</p>
        
        <input type="text" id="streamUrl" 
               value="https://airtelapp.shemaroo.com">
        <br>
        <button onclick="initPlayer()">Play via Netlify Proxy</button>

        <div id="status">Status: Ready</div>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        function initPlayer() {
            const video = document.getElementById('video');
            const status = document.getElementById('status');
            const rawUrl = document.getElementById('streamUrl').value.trim();
            
            // This builds the path to your Edge Function: https://your-site.netlify.app...
            const proxyUrl = window.location.origin + "/proxy?url=" + encodeURIComponent(rawUrl);

            status.innerText = "Connecting to Netlify Edge...";

            if (Hls.isSupported()) {
                const hls = new Hls({
                    // This tells Hls.js to use the proxy for ALL internal fragments (.ts files)
                    xhrSetup: function(xhr, url) {
                        // If the segment doesn't already go through your proxy, force it
                        if (!url.includes(window.location.origin)) {
                            const proxiedUrl = window.location.origin + "/proxy?url=" + encodeURIComponent(url);
                            xhr.open('GET', proxiedUrl, true);
                        }
                    }
                });

                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    status.innerText = "Playing: " + rawUrl;
                    video.play();
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        status.innerText = "Error: Proxy returned " + data.response?.code || "Unknown";
                        console.error("HLS Error:", data);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For Safari/iOS
                video.src = proxyUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
