<!DOCTYPE html>
<html>
<head>
    <title>HLS Video Player</title>
    <!-- Include the Hls.js library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <video id="video" controls autoplay muted style="width: 100%; max-width: 640px;"></video>

    <script>
      var video = document.getElementById('video');
      var videoSrc = 'http://192.101.68.100:49893/ghLs2zdZSnFvSS0000545c313e3e996b33209da8ec/index.m3u8?token=4028bc332d502518763731deff7ae23d';

      if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
      } 
      // For Safari, which supports HLS natively
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
      }
    </script>
</body>
</html>
