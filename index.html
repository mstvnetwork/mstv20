<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>

<style>
/* ===== Global Reset ===== */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }

/* ===== Title & News ===== */
.title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: 30px 0 10px; color: #FFF; font-weight: 700; letter-spacing: 2px; }
.scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; }

/* ===== SLEEK SELECTOR ===== */
.selector-wrapper { max-width: 600px; margin: 0 auto 30px; padding: 0 20px; text-align: center; }
.instruction-text { font-size: 0.8rem; color: #90EE90; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
.modern-select-container { position: relative; background: #1e2227; border: 2px solid #333; border-radius: 12px; padding: 0; transition: 0.3s; }
.modern-select-container:hover { border-color: #90EE90; }

select {
  width: 100%; background: transparent; border: none; color: #fff; padding: 15px;
  font-size: 1.05rem; font-weight: 600; cursor: pointer; outline: none; -webkit-appearance: none;
}
.modern-select-container::after { content: '▼'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #90EE90; pointer-events: none; }

/* ===== PLAYER CONTAINER ===== */
.player-container {
  position: relative; width: 95%; max-width: 1200px; margin: 0 auto 30px;
  border-radius: 12px; overflow: hidden; background: #1A1D20; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}
.player-container::before { content: ""; display: block; padding-top: 56.25%; }
.player-container iframe, .player-container video, #placeholder-image {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;
}

/* ===== FB & FOOTER ===== */
.fb-container { text-align: center; margin-bottom: 40px; }
.fb-link { display: inline-flex; align-items: center; text-decoration: none; color: #fff; background: #1877F2; padding: 10px 20px; border-radius: 50px; font-weight: bold; }
footer { background: #000; color: #888; text-align: center; padding: 30px; border-top: 1px solid #222; }
.live-stamp { position: absolute; top: 15px; left: 15px; background: #E50914; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; z-index: 10; }
.loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #90EE90; display: none; z-index: 20; }
</style>
</head>

<body>
<div class="title-3d">AAINA DTH FREE</div>

<div class="scrolling-news">
    <marquee behavior="scroll" direction="left" scrollamount="6">Welcome to MSTV Network! Enjoy 24/7 Premium Entertainment.</marquee>
</div>

<div class="selector-wrapper">
    <span class="instruction-text">Select Your Channel</span>
    <div class="modern-select-container">
        <select id="channel-select">
            <option value="">👉 Click to Choose...</option>
        </select>
    </div>
</div>

<div class="player-container">
    <iframe id="media-player" allow="autoplay; encrypted-media"></iframe>
    <video id="video-player" autoplay playsinline muted></video>
    <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
    <div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
    <div class="loading-indicator" id="loading">Connecting...</div>
</div>

<div class="fb-container">
    <a href="https://facebook.com" target="_blank" class="fb-link">Follow us on Facebook</a>
</div>

<footer>
    <h3>About MSTV</h3>
    <p>Premium free-to-air entertainment streaming platform.</p>
    <p>&copy; <span id="year"></span> MSTV Network. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const liveStamp = document.getElementById('live-stamp');
let hlsInstance = null;

const channelsData = [
  { name: "📺 Aaina DTH Main", url: "https://mstvnetwork.github.io", type: "iframe" },
  { name: "🎬 Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net", type: "hls" },
  { name: "🎥 Zee Cinema", url: "https://fscott.sytes.net", type: "iframe" }
];

channelsData.forEach((channel, index) => {
  const opt = document.createElement('option');
  opt.value = index;
  opt.textContent = channel.name;
  select.appendChild(opt);
});

// Reset display on load
videoPlayer.style.display = 'none';
iframePlayer.style.display = 'none';
liveStamp.style.display = 'none';

function playChannel(channel) {
  loading.style.display = 'block';
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  videoPlayer.pause(); videoPlayer.style.display = 'none';
  iframePlayer.src = ''; iframePlayer.style.display = 'none';
  liveStamp.style.display = 'none';
  placeholder.style.display = 'none';

  if (!channel) { placeholder.style.display = 'block'; loading.style.display = 'none'; return; }

  if (channel.type === "hls") {
    if (Hls.isSupported()) {
      videoPlayer.style.display = "block";
      hlsInstance = new Hls();
      hlsInstance.loadSource(channel.url);
      hlsInstance.attachMedia(videoPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { videoPlayer.play(); loading.style.display = 'none'; });
    }
  } else {
    iframePlayer.src = channel.url;
    iframePlayer.style.display = "block";
    liveStamp.style.display = "block";
    loading.style.display = 'none';
  }
}

select.addEventListener("change", () => {
  const index = select.value;
  playChannel(index === "" ? null : channelsData[index]);
});
</script>
</body>
</html>
