<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO & GOOGLE VERIFICATION -->
<title>MSTV Network | Premium DTH Streaming</title>
<meta name="description" content="Watch Bollywood Classics, Colors TV, and Premium Sports for free. Ad-Free DTH streaming.">
<link rel="canonical" href="https://mstvnet.netlify.app" />
<meta name="google-site-verification" content="google36a9620cce1db39f" />

<!-- HLS Library -->
<script src="https://cdnjs.cloudflare.com"></script>

<style>
body{margin:0;font-family:Arial,sans-serif;color:#E0E0E0;background:#0F1115;overflow-x:hidden;}
.title-3d{font-size:clamp(1.8rem,4vw,3.5rem);text-align:center;margin:30px 0 10px;color:#FFF;font-weight:800;}
.scrolling-news{background:#1A1D20;color:#90EE90;padding:12px 0;border-top:1px solid #333;border-bottom:1px solid #333;margin-bottom:20px;font-weight:600;}
.channel-heading{text-align:center;font-size:14px;color:#90EE90;font-weight:600;margin-bottom:15px;}
.ribbon-wrapper{position:relative;max-width:1000px;margin:0 auto 30px;display:flex;align-items:center;gap:10px;padding:0 10px;}
.channel-ribbon{overflow:hidden;position:relative;width:100%;height:100px;}
.channel-ribbon-inner{display:flex;flex-wrap:nowrap;gap:15px;will-change:transform;position:absolute;top:0;left:0;}
.nav-btn{background:rgba(26,29,32,.8);border:1px solid #333;color:#90EE90;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;}
.logo-card{flex:0 0 120px;background:#1A1D20;border:1px solid #333;border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative;}
.logo-card.active{border-color:#90EE90;background:rgba(144,238,144,.1);}
.logo-card img{width:100%;height:50px;object-fit:contain;display:block;}
.logo-card span{display:block;font-size:10px;margin-top:5px;color:#888;font-weight:600;}
#fullscreen-wrapper{position:relative;width:95%;max-width:1000px;margin:0 auto 10px;background:#000;border-radius:12px;overflow:hidden;}
.player-container{position:relative;width:100%;padding-top:56.25%;background:#000;}
#video-player,#iframe-player,#placeholder-image{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
#placeholder-image{background:linear-gradient(135deg,#0d0d2b 0%,#1a1d40 50%,#0f1115 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;}
.placeholder-content{text-align:center;max-width:90%;}
.placeholder-arrow{font-size:2.5rem;color:#90EE90;margin-bottom:15px;}
.placeholder-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;letter-spacing:2px;}
.placeholder-sub{font-size:clamp(.9rem,2vw,1.2rem);color:#90EE90;font-weight:600;}
#channel-messages-container{max-width:1000px;margin:10px auto;display:flex;flex-direction:column;gap:6px;color:#90EE90;font-weight:600;font-size:14px;text-align:center;min-height:30px;}
.channel-message{background:rgba(26,29,32,.8);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .3s ease;}
.loader-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;z-index:20;}
.spinner{width:40px;height:40px;border:3px solid rgba(144,238,144,.2);border-top:3px solid #90EE90;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
footer{background:#0F1115;border-top:2px solid #90EE90;padding:40px 20px;text-align:center;}
footer h4{color:#90EE90;margin-bottom:12px;}
footer p{color:#ccc;font-size:14px;}
</style>
</head>
<body>

<div class="title-3d">MSTV NETWORK</div>
<div class="scrolling-news"><marquee scrollamount="6">Aaina DTH Free | Premium Ad-Free Streaming | Sourced from Public Domains</marquee></div>
<div class="channel-heading">⬇️ CLICK TO PLAY ⬇️</div>

<div class="ribbon-wrapper">
  <button class="nav-btn" onclick="scrollRibbon(-200)">⬅️</button>
  <div class="channel-ribbon"><div class="channel-ribbon-inner" id="ribbon-inner"></div></div>
  <button class="nav-btn" onclick="scrollRibbon(200)">➡️</button>
</div>

<div id="fullscreen-wrapper">
  <div class="player-container">
    <video id="video-player" playsinline muted controls style="display:none;"></video>
    
    <!-- IFRAME WITH PERMISSIONS FOR COLORS TV -->
    <iframe id="iframe-player" 
            style="display:none;" 
            allow="autoplay; fullscreen; encrypted-media" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-popups" 
            referrerpolicy="no-referrer">
    </iframe>

    <div id="placeholder-image">
      <div class="placeholder-content">
        <div class="placeholder-arrow">⬆️</div>
        <div class="placeholder-title">MSTV NETWORK</div>
        <div class="placeholder-sub">Select a channel to watch live</div>
      </div>
    </div>
    <div class="loader-container" id="loader"><div class="spinner"></div></div>
  </div>
  <div id="channel-messages-container"></div>
</div>

<footer>
<div style="max-width:800px;margin:0 auto;">
<h4>About MSTV Network</h4>
<p>Non-profit platform. Best on Android & Windows Chrome. Content sourced publicly.</p>
<p>© <span id="year"></span> MSTV Network</p>
</div>
</footer>

<script>
document.getElementById('year').textContent=new Date().getFullYear();

const videoPlayer=document.getElementById('video-player');
const iframePlayer=document.getElementById('iframe-player');
const loader=document.getElementById('loader');
const placeholder=document.getElementById('placeholder-image');
const ribbonInner=document.getElementById('ribbon-inner');
const channelMessagesContainer=document.getElementById('channel-messages-container');
let hlsInstance=null;
let currentChannelIndex=null;

const channelsData=[
  {name:"Bollywood Classics Hd",type:"hls",url:"https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8",logo:"images (1).jpeg",messages:["Please wait channel will load"]},
  {name:"Zee Cinema",type:"iframe",url:"https://freeways.hosthampster.com/zeecinema.html?autoplay=1",logo:"images.jpeg",messages:[]},
  {name:"Colors Hd", type:"iframe", url:"//cdn.stmify.com/embed-free/v1/colors-hd-in-jw", logo:"images (3).jpeg", messages:["Please wait channel to load"]}
];


function buildRibbon(){
  ribbonInner.innerHTML='';
  channelsData.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='logo-card';
    card.innerHTML=`<img loading="lazy" src="${ch.logo}"><span>${ch.name}</span>`;
    card.onclick=()=>handleSelection(i);
    ribbonInner.appendChild(card);
  });
  for(let j=0; j<channelsData.length; j++){
    const clone = ribbonInner.children[j].cloneNode(true);
    clone.onclick = ribbonInner.children[j].onclick;
    ribbonInner.appendChild(clone);
  }
}
buildRibbon();

let scrollX=0;
function animateRibbon(){
  scrollX-=0.4;
  if(Math.abs(scrollX)>=ribbonInner.scrollWidth/2) scrollX=0;
  ribbonInner.style.transform=`translateX(${scrollX}px)`;
  requestAnimationFrame(animateRibbon);
}
requestAnimationFrame(animateRibbon);

function scrollRibbon(distance){
    scrollX += distance;
    if(scrollX > 0) scrollX = -(ribbonInner.scrollWidth/2);
    if(Math.abs(scrollX) >= ribbonInner.scrollWidth/2) scrollX = 0;
    ribbonInner.style.transform=`translateX(${scrollX}px)`;
}

function openFullscreen(){
  const fsWrapper=document.getElementById('fullscreen-wrapper');
  if(fsWrapper.requestFullscreen) fsWrapper.requestFullscreen();
  else if(fsWrapper.webkitRequestFullscreen) fsWrapper.webkitRequestFullscreen();
}

function stopAllPlayback(){
  if(hlsInstance){ hlsInstance.destroy(); hlsInstance = null; }
  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.load();
  videoPlayer.style.display='none';
  iframePlayer.src='';
  iframePlayer.style.display='none';
}

function handleSelection(index){
  const channel=channelsData[index];
  currentChannelIndex=index;
  stopAllPlayback();
  placeholder.style.display='none';
  loader.style.display='flex';
  
  document.querySelectorAll('.logo-card').forEach((c, i)=> {
      c.classList.toggle('active', i === index || i === index + channelsData.length);
  });

  setTimeout(openFullscreen, 400);

  if(channel.type==='hls'){
    videoPlayer.style.display='block';
    if(typeof Hls !== 'undefined' && Hls.isSupported()){
      hlsInstance = new Hls();
      hlsInstance.loadSource(channel.url);
      hlsInstance.attachMedia(videoPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
          loader.style.display='none';
          videoPlayer.play().catch(() => { videoPlayer.muted = true; videoPlayer.play(); });
      });
    } else if(videoPlayer.canPlayType('application/vnd.apple.mpegurl')){
      videoPlayer.src=channel.url;
      videoPlayer.onloadedmetadata = () => { loader.style.display='none'; videoPlayer.play(); };
    }
  } else {
    iframePlayer.style.display='block';
    iframePlayer.src=channel.url;
    const timeout=setTimeout(()=>loader.style.display='none', 5000);
    iframePlayer.onload=()=>{clearTimeout(timeout); loader.style.display='none';};
  }
}
</script>

<script data-goatcounter="https://mstv20.goatcounter.com" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
