<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>
<style>
  /* Keep your original CSS from the previous message here */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }
  .title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: 40px 0 10px; color: #FFFFFF; font-weight: 700; }
  .scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; }
  .channel-selector-text { text-align: center; font-size: 1.5rem; margin: 20px 0; }
  .channel-selection { display: flex; justify-content: center; margin-bottom: 30px; }
  select { width: 90%; max-width: 500px; padding: 12px; background: #1A1D20; color: #90EE90; border: 1px solid #90EE90; border-radius: 8px; }
  .player-container { position: relative; width: 95%; max-width: 1200px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .player-container iframe, .player-container video, #placeholder-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; object-fit: contain; }
  .live-stamp { position: absolute; top: 15px; left: 15px; background: #E50914; color: white; padding: 6px 12px; border-radius: 4px; z-index: 10; font-weight: bold; }
  .loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #90EE90; z-index: 20; display: none; }
  .fs-button { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #90EE90; border: 1px solid #90EE90; padding: 8px 12px; border-radius: 5px; cursor: pointer; z-index: 30; display: none; }
  .player-container:fullscreen { width: 100vw; height: 100vh; max-width: none; }
  footer { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>

<div class="title-3d">AAINA DTH FREE</div>
<div class="scrolling-news"><marquee>Welcome to MSTV Network - High-quality streaming 24/7.</marquee></div>
<div class="channel-selector-text">Select Channel</div>
<div class="channel-selection">
  <select id="channel-select"><option value="">👉 Select a Channel</option></select>
</div>

<div class="player-container" id="main-container">
    <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
    <video id="video-player" playsinline controls style="display:none;"></video>
    <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
    <div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
    <div class="loading-indicator" id="loading">Loading stream...</div>
    <button class="fs-button" id="fs-btn">⛶ FULLSCREEN</button>
</div>

<footer>&copy; <span id="year"></span> MSTV Network.</footer>

<script src="https://cdn.jsdelivr.net"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const fsBtn = document.getElementById('fs-btn');
const container = document.getElementById('main-container');

let hls = null;

const channelsData = [
    { name: "Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8", type: "hls" },
    { name: "Aaina DTH Main", url: "https://mstvnetwork.github.io/Aaina-Dth", type: "iframe" },
    { name: "Zee Cinema", url: "https://fscott.sytes.net/zeecinema.html", type: "iframe" }
];

channelsData.forEach((channel, index) => {
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = channel.name;
    select.appendChild(opt);
});

function playChannel(channel) {
    if (hls) { hls.destroy(); hls = null; }
    videoPlayer.pause();
    videoPlayer.src = "";
    videoPlayer.style.display = "none";
    iframePlayer.src = "";
    iframePlayer.style.display = "none";
    placeholder.style.display = "none";
    loading.style.display = "block";
    fsBtn.style.display = "block";

    if (!channel) {
        placeholder.style.display = "block";
        loading.style.display = "none";
        fsBtn.style.display = "none";
        return;
    }

    if (channel.type === "hls") {
        videoPlayer.style.display = "block";
        if (Hls.isSupported()) {
            hls = new Hls();
            hls.attachMedia(videoPlayer);
            hls.on(Hls.Events.MEDIA_ATTACHED, () => {
                hls.loadSource(channel.url);
            });
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                videoPlayer.play().catch(() => {
                    videoPlayer.muted = true; // Autoplay fix
                    videoPlayer.play();
                });
                loading.style.display = "none";
            });
            // Error Handling
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error("HLS Fatal Error:", data.type);
                    hls.recoverMediaError();
                }
            });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            videoPlayer.src = channel.url;
            videoPlayer.play();
            loading.style.display = "none";
        }
    } else {
        iframePlayer.src = channel.url;
        iframePlayer.style.display = "block";
        loading.style.display = "none";
    }
}

select.addEventListener("change", () => {
    const val = select.value;
    playChannel(val === "" ? null : channelsData[val]);
});

fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
    } else {
        document.exitFullscreen();
    }
});
</script>
</body>
</html>
