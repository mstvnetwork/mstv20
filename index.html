<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MSTV Network</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0F1115;
  color:#E0E0E0
}
body{display:flex;flex-direction:column;align-items:center}
.container{
  flex:1;
  width:95%;
  max-width:1200px;
  padding:2vh 2vw;
  display:flex;
  flex-direction:column;
  align-items:center
}
.title-3d{
  font-size:clamp(2rem,6vw,3.5rem);
  font-weight:800;
  margin:4vh 0 2vh;
  color:#00FFC8;
  text-align:center
}
.channel-selector-text{
  font-size:clamp(1.4rem,4vw,2rem);
  margin-bottom:2vh
}
select{
  padding:0.8em 1.5em;
  font-size:1.1em;
  background:#1A1D20;
  color:#00FFC8;
  border:2px solid #00FFC8;
  border-radius:12px;
  width:90%;
  max-width:400px
}
.player-container{
  position:relative;
  width:90%;
  max-width:1100px;
  aspect-ratio:16/9;
  margin-bottom:2vh;
  border-radius:16px;
  overflow:hidden;
  background:#1A1D20
}
.player-container iframe,
.player-container video{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  display:none;
  background:black
}
#placeholder-image{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover
}
.loading-indicator{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.7);
  padding:12px 24px;
  border-radius:8px;
  display:none
}
.live-stamp{
  position:absolute;
  top:10px;
  left:10px;
  background:#E50914;
  color:white;
  padding:6px 12px;
  font-size:14px;
  border-radius:6px;
  display:none
}
#channel-message{
  margin-top:12px;
  font-size:14px;
  text-align:center;
  color:#00FFC8
}
</style>
</head>
<body>

<div class="container">
  <div class="title-3d">AAINA DTH FREE</div>

  <div class="channel-selector-text">Select Channel</div>

  <select id="channel-select">
    <option value="">👉 Select Channel</option>
  </select>

  <div class="player-container" id="player-container">
    <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture"
      sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>

    <video id="video-player" playsinline muted></video>

    <img id="placeholder-image" src="Design-Studio-2025-01-22%20(1).png" alt="Stream Placeholder">

    <div class="live-stamp" id="live-stamp">LIVE</div>
    <div class="loading-indicator" id="loading">Loading stream...</div>
  </div>

  <div id="channel-message"></div>
</div>

<script>
const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const liveStamp = document.getElementById('live-stamp');
const messageBox = document.getElementById('channel-message');

let hlsInstance = null;
let channelsData = [];

const JSON_URL = "./channels.json";

function showLoading(show){
  loading.style.display = show ? 'block' : 'none';
}

function stopAllPlayback(){
  if(hlsInstance){
    hlsInstance.destroy();
    hlsInstance = null;
  }
  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.load();
  videoPlayer.style.display = 'none';

  iframePlayer.src = '';
  iframePlayer.style.display = 'none';

  liveStamp.style.display = 'none';
}

let hlsScriptLoaded = false;

function loadHlsScript(){
  return new Promise(resolve=>{
    if(hlsScriptLoaded) return resolve();
    const script=document.createElement('script');
    script.src="https://cdn.jsdelivr.net/npm/hls.js@latest";
    script.onload=()=>{
      hlsScriptLoaded=true;
      resolve();
    };
    document.body.appendChild(script);
  });
}

async function playChannel(channel){
  stopAllPlayback();
  placeholder.style.display='none';
  showLoading(true);

  if(!channel){
    placeholder.style.display='block';
    showLoading(false);
    messageBox.textContent='';
    return;
  }

  messageBox.textContent = channel.message || '';

  if(channel.type==='hls'){
    videoPlayer.style.display='block';
    videoPlayer.controls=true;
    videoPlayer.muted=true;
    videoPlayer.autoplay=true;

    if(videoPlayer.canPlayType('application/vnd.apple.mpegurl')){
      videoPlayer.src=channel.url;
      videoPlayer.play().then(()=>{
        showLoading(false);
        liveStamp.style.display='block';
      }).catch(()=>showLoading(false));
    }else{
      await loadHlsScript();
      hlsInstance=new Hls({enableWorker:true,lowLatencyMode:true});
      hlsInstance.loadSource(channel.url);
      hlsInstance.attachMedia(videoPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
        videoPlayer.play().then(()=>{
          showLoading(false);
          liveStamp.style.display='block';
        }).catch(()=>showLoading(false));
      });
    }
  }
  else if(channel.type==='iframe'){
    iframePlayer.src=channel.url;
    iframePlayer.style.display='block';
    showLoading(false);
    liveStamp.style.display='block';
  }
}

async function fetchChannelsJson(){
  try{
    const response=await fetch(JSON_URL);
    if(!response.ok) throw new Error();
    channelsData=await response.json();

    select.innerHTML='<option value="">👉 Select Channel</option>';
    channelsData.forEach((ch,i)=>{
      const opt=document.createElement('option');
      opt.value=i;
      opt.textContent=ch.name;
      select.appendChild(opt);
    });
  }catch(e){
    console.error('JSON load error',e);
  }
}

select.addEventListener('change',()=>{
  const index=select.value;
  playChannel(index===''?null:channelsData[index]);
});

fetchChannelsJson();
</script>

</body>
</html>
