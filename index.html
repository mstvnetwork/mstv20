<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>

<style>
/* ===== Global Reset ===== */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }

/* ===== Fluid Title ===== */
.title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: clamp(20px, 5vh, 40px) 0 10px; color: #FFFFFF; letter-spacing: 2px; font-weight: 700; }

.scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; font-weight: 500; }

.channel-selector-text { text-align: center; font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 4vh 0 2vh; font-weight: 600; }

.channel-selection { display: flex; justify-content: center; padding: 0 15px; margin-bottom: 5vh; }

select { width: 100%; max-width: 500px; padding: 12px; font-size: clamp(0.9rem, 2vw, 1.2rem); background: #1A1D20; color: #90EE90; border: 1px solid #90EE90; border-radius: 8px; text-align: center; outline: none; cursor: pointer; }

/* ===== Responsive Player ===== */
.player-container {
  position: relative;
  width: 95%;
  max-width: 1200px;
  margin: 0 auto 30px;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* Maintain 16:9 Aspect Ratio */
.player-container::before { content: ""; display: block; padding-top: 56.25%; }

.player-container iframe,
.player-container video,
#placeholder-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; object-fit: contain; }

/* NEW: Fullscreen Button Styles */
.fs-button {
  position: absolute;
  bottom: 15px;
  right: 15px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  border: 1px solid #90EE90;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  z-index: 30;
  font-weight: bold;
  display: none; /* Hidden until a channel plays */
}
.fs-button:hover { background: #90EE90; color: #000; }

/* Ensure elements fill screen when in Fullscreen Mode */
.player-container:fullscreen { width: 100vw; height: 100vh; max-width: none; border-radius: 0; }
.player-container:fullscreen::before { display: none; }

.fb-follow-container { text-align: center; margin-bottom: 60px; }
.fb-link { display: inline-flex; align-items: center; text-decoration: none; color: #ffffff; background: #1877F2; padding: 10px 20px; border-radius: 50px; font-weight: bold; transition: transform 0.2s ease; }
.fb-link:hover { transform: scale(1.05); }
.fb-icon { width: 24px; margin-right: 10px; }

footer { background: #000; color: #888; text-align: center; padding: 40px 20px; border-top: 1px solid #222; }
.live-stamp { position: absolute; top: 15px; left: 15px; background: #E50914; color: white; font-weight: 700; font-size: clamp(12px, 1.5vw, 18px); padding: 6px 14px; border-radius: 6px; z-index: 10; }
.loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: #90EE90; padding: 12px 25px; border-radius: 8px; display: none; z-index: 20; }
</style>
</head>
<body>

<div class="title-3d">AAINA DTH FREE</div>

<div class="scrolling-news">
    <marquee behavior="scroll" direction="left" scrollamount="6">
        Welcome to MSTV Network - AAINA DTH FREE! Experience high-quality streaming 24/7.
    </marquee>
</div>

<div class="channel-selector-text">Select Channel</div>

<div class="channel-selection">
<select id="channel-select">
    <option value="">👉📺📺📺</option>
</select>
</div>

<div class="player-container" id="main-container">
    <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
    <video id="video-player" autoplay playsinline muted disablePictureInPicture controlsList="nodownload nofullscreen" style="pointer-events:none;"></video>
    <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
    <div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
    <div class="loading-indicator" id="loading">Loading stream...</div>
    <!-- Fullscreen Toggle Button -->
    <button class="fs-button" id="fs-btn">⛶ FULLSCREEN</button>
</div>

<div class="fb-follow-container">
    <a href="https://www.facebook.com" target="_blank" class="fb-link">
        <img src="https://upload.wikimedia.org" alt="FB" class="fb-icon">
        Click here to follow us
    </a>
</div>

<footer>
    <div class="footer-content">
        <p>MSTV Network &copy; <span id="year"></span>. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const liveStamp = document.getElementById('live-stamp');
const container = document.getElementById('main-container');
const fsBtn = document.getElementById('fs-btn');

let hlsInstance = null;

const channelsData = [
    { name: "Aaina DTH Main", url: "https://mstvnetwork.github.io/Aaina-Dth", type: "iframe" },
    { name: "Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8", type: "hls" },
    { name: "Zee Cinema", url: "https://fscott.sytes.net/zeecinema.html", type: "iframe" }
];

channelsData.forEach((channel, index) => {
    const option = document.createElement('option');
    option.value = index;
    option.textContent = channel.name;
    select.appendChild(option);
});

// Fullscreen Logic
fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        if (container.requestFullscreen) {
            container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) { /* Safari */
            container.webkitRequestFullscreen();
        } else if (container.msRequestFullscreen) { /* IE11 */
            container.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

function playChannel(channel) {
    loading.style.display = 'block';
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    videoPlayer.pause();
    videoPlayer.style.display = 'none';
    iframePlayer.style.display = 'none';
    placeholder.style.display = 'none';
    fsBtn.style.display = 'block'; // Show button when a channel is chosen

    if (!channel) {
        placeholder.style.display = 'block';
        loading.style.display = 'none';
        fsBtn.style.display = 'none';
        return;
    }

    if (channel.type === "hls") {
        videoPlayer.style.display = "block";
        if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(channel.url);
            hlsInstance.attachMedia(videoPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                videoPlayer.play();
                loading.style.display = 'none';
            });
        } else {
            videoPlayer.src = channel.url;
            videoPlayer.play();
            loading.style.display = 'none';
        }
    } else {
        iframePlayer.src = channel.url;
        iframePlayer.style.display = "block";
        loading.style.display = 'none';
    }
}

select.addEventListener("change", () => {
    const index = select.value;
    playChannel(index === "" ? null : channelsData[index]);
});
</script>
</body>
</html>
