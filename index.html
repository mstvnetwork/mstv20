<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>

<!-- LOAD LIBRARY FIRST IN HEAD TO PREVENT "Hls is not defined" -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
/* ===== Global Reset ===== */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }

.title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: clamp(20px, 5vh, 40px) 0 10px; color: #FFFFFF; letter-spacing: 2px; font-weight: 700; }
.scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; font-weight: 500; }
.channel-selector-text { text-align: center; font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 4vh 0 2vh; font-weight: 600; }
.channel-selection { display: flex; justify-content: center; padding: 0 15px; margin-bottom: 5vh; }

select { width: 100%; max-width: 500px; padding: 12px; font-size: clamp(0.9rem, 2vw, 1.2rem); background: #1A1D20; color: #90EE90; border: 1px solid #90EE90; border-radius: 8px; text-align: center; outline: none; cursor: pointer; }

/* ===== Fullscreen Wrapper & Player ===== */
#fullscreen-wrapper { position: relative; width: 95%; max-width: 1200px; margin: 0 auto 30px; background: #000; }
#fullscreen-wrapper:fullscreen { width: 100vw; height: 100vh; max-width: none; margin: 0; }
.player-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #1A1D20; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.player-container::before { content: ""; display: block; padding-top: 56.25%; }
#fullscreen-wrapper:fullscreen .player-container::before { display: none; }
#fullscreen-wrapper:fullscreen .player-container { height: 100%; }

.player-container iframe, .player-container video, #placeholder-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; border: none; }

/* Custom Exit Button */
#exit-fs-btn { display: none; position: absolute; top: 20px; right: 20px; z-index: 9999; background: rgba(229, 9, 20, 0.9); color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-weight: bold; }
#fullscreen-wrapper:fullscreen #exit-fs-btn { display: block; }

.live-stamp { position: absolute; top: 15px; left: 15px; background: #E50914; color: white; font-weight: 700; padding: 6px 14px; border-radius: 6px; z-index: 10; display: none; }
.loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: #90EE90; padding: 12px 25px; border-radius: 8px; z-index: 20; display: none; }

.fb-follow-container { text-align: center; margin-bottom: 60px; }
.fb-link { display: inline-flex; align-items: center; text-decoration: none; color: #ffffff; background: #1877F2; padding: 10px 20px; border-radius: 50px; font-weight: bold; }
footer { background: #000; color: #888; text-align: center; padding: 40px 20px; border-top: 1px solid #222; }
</style>
</head>
<body>

<div class="title-3d">AAINA DTH FREE</div>
<div class="scrolling-news"><marquee behavior="scroll" direction="left" scrollamount="6">Welcome to MSTV Network!</marquee></div>
<div class="channel-selector-text">Select Channel</div>
<div class="channel-selection">
  <select id="channel-select"><option value="">👉📺📺📺</option></select>
</div>

<div id="fullscreen-wrapper">
    <button id="exit-fs-btn" onclick="exitFullscreen()">EXIT FULLSCREEN</button>
    <div class="player-container">
        <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        <video id="video-player" autoplay playsinline controlsList="nodownload"></video>
        <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
        <div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
        <div class="loading-indicator" id="loading">Loading stream...</div>
    </div>
</div>

<div class="fb-follow-container"><a href="https://www.facebook.com" target="_blank" class="fb-link">Follow us on Facebook</a></div>

<footer><div class="footer-content">&copy; <span id="year"></span> MSTV Network. All Rights Reserved.</div></footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const select = document.getElementById('channel-select'), videoPlayer = document.getElementById('video-player'), iframePlayer = document.getElementById('media-player'), placeholder = document.getElementById('placeholder-image'), loading = document.getElementById('loading'), liveStamp = document.getElementById('live-stamp'), fsWrapper = document.getElementById('fullscreen-wrapper');

let hlsInstance = null;
const channelsData = [
    { name: "Aaina DTH Main", url: "https://mstvnetwork.github.io/Aaina-Dth", type: "iframe", showBadge: false },
    { name: "Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8", type: "hls", showBadge: false },
    { name: "Zee Cinema", url: "https://fscott.sytes.net/zeecinema.html" type: "iframe", showBadge: true }
];

channelsData.forEach((ch, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = ch.name; select.appendChild(opt); });

function enterFullscreen() {
    if (fsWrapper.requestFullscreen) fsWrapper.requestFullscreen();
    else if (fsWrapper.webkitRequestFullscreen) fsWrapper.webkitRequestFullscreen();
}

function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}

function stopAllPlayback() {
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    videoPlayer.pause(); videoPlayer.removeAttribute('src'); videoPlayer.load();
    videoPlayer.style.display = 'none'; iframePlayer.src = ''; iframePlayer.style.display = 'none';
    liveStamp.style.display = 'none';
}

function playChannel(channel) {
    loading.style.display = 'block';
    stopAllPlayback();
    placeholder.style.display = 'none';
    if (!channel) { placeholder.style.display = 'block'; loading.style.display = 'none'; return; }

    liveStamp.style.display = channel.showBadge ? "block" : "none";
    enterFullscreen();

    if (channel.type === "hls") {
        videoPlayer.style.display = "block";
        // Check if Hls library is loaded correctly
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(channel.url);
            hlsInstance.attachMedia(videoPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                videoPlayer.play().catch(e => console.log("Autoplay blocked", e));
                loading.style.display = 'none';
            });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            videoPlayer.src = channel.url;
            videoPlayer.play().catch(e => console.log("Safari play error", e));
            loading.style.display = 'none';
        } else {
            alert("HLS playback is not supported or library failed to load.");
            loading.style.display = 'none';
        }
    } else {
        iframePlayer.src = channel.url;
        iframePlayer.style.display = "block";
        loading.style.display = 'none';
    }
}

select.addEventListener("change", () => {
    const index = select.value;
    playChannel(index === "" ? null : channelsData[index]);
});
</script>
</body>
</html>
