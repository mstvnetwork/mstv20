<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>
<script src="https://cdn.jsdelivr.net"></script>
<style>
/* Reset & Theme */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }
.title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: 30px 0 10px; color: #FFFFFF; font-weight: 700; }
.scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; font-weight: 500; }
.channel-selector-text { text-align: center; font-size: 1.5rem; margin: 20px 0; }
.channel-selection { display: flex; justify-content: center; margin-bottom: 30px; }
select { width: 90%; max-width: 500px; padding: 12px; background: #1A1D20; color: #90EE90; border: 1px solid #90EE90; border-radius: 8px; cursor: pointer; outline: none; }

/* Player Container */
#fullscreen-wrapper { position: relative; width: 95%; max-width: 1200px; margin: 0 auto 30px; background: #000; border-radius: 12px; overflow: hidden; }
.player-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #1A1D20; }
.player-container iframe, .player-container video, #placeholder-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; border: none; display: none; }
#placeholder-image { display: block; }

/* Loader & Error Message */
.loader-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; display: none; flex-direction: column; align-items: center; gap: 15px; pointer-events: none; }
.spinner { width: 50px; height: 50px; border: 3px solid rgba(144, 238, 144, 0.1); border-top: 3px solid #90EE90; border-radius: 50%; animation: spin 1s linear infinite; }
.loading-text { color: #90EE90; font-size: 14px; font-weight: 500; text-transform: uppercase; animation: fadePulse 1.5s infinite; text-shadow: 0 0 8px rgba(144, 238, 144, 0.4); }
.loading-text.error { color: #ff4d4d !important; text-shadow: 0 0 8px rgba(255, 77, 77, 0.6) !important; animation: none; }

/* UNMUTE PROMPT */
#unmute-prompt {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(144, 238, 144, 0.9); color: #000;
    padding: 10px 20px; border-radius: 30px; font-weight: bold;
    cursor: pointer; z-index: 110; display: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 12px;
    letter-spacing: 1px; border: none;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
footer { background: #000; color: #888; text-align: center; padding: 40px; border-top: 1px solid #222; }
</style>
</head>
<body>

<div class="title-3d">AAINA DTH FREE</div>
<div class="scrolling-news"><marquee>Welcome to MSTV Network! Premium Live Streaming Experience.</marquee></div>

<div class="channel-selector-text">Select Channel</div>
<div class="channel-selection">
    <select id="channel-select"><option value="">👉📺📺📺</option></select>
</div>

<div id="fullscreen-wrapper">
    <div class="player-container">
        <!-- Unmute Button -->
        <button id="unmute-prompt" onclick="unmuteVideo()">🔊 CLICK TO UNMUTE</button>
        
        <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
        <video id="video-player" autoplay playsinline muted controls></video>
        <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
        
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <span class="loading-text" id="loader-msg">Please Wait channel loading</span>
        </div>
    </div>
</div>

<footer>&copy; <span id="year"></span> MSTV Network. All Rights Reserved.</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const select = document.getElementById('channel-select'), 
      video = document.getElementById('video-player'), 
      iframe = document.getElementById('media-player'), 
      placeholder = document.getElementById('placeholder-image'), 
      loader = document.getElementById('loader'), 
      loaderMsg = document.getElementById('loader-msg'),
      unmuteBtn = document.getElementById('unmute-prompt');

let hls = null;
let loadTimeout = null;

const channelsData = [
    { name: "Aaina DTH Main", url: "https://mstvnetwork.github.io/Aaina-Dth", type: "iframe" },
    { name: "Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8", type: "hls" },
    { name: "Zee Cinema", url: "https://fscott.sytes.net/zeecinema.html", type: "iframe" }
];

channelsData.forEach((ch, i) => { 
    const opt = document.createElement('option'); 
    opt.value = i; opt.textContent = ch.name; 
    select.appendChild(opt); 
});

function stopAll() {
    clearTimeout(loadTimeout);
    unmuteBtn.style.display = 'none';
    if (hls) { hls.destroy(); hls = null; }
    video.pause(); video.muted = true; video.src = ""; video.load();
    video.style.display = 'none'; 
    iframe.src = ''; iframe.style.display = 'none';
    placeholder.style.display = 'block';
}

function clearLoader() {
    clearTimeout(loadTimeout);
    loader.style.display = 'none';
    loaderMsg.textContent = "Please Wait channel loading";
    loaderMsg.classList.remove('error');
    // Show unmute prompt if it's an HLS channel and still muted
    if(video.style.display === 'block' && video.muted) {
        unmuteBtn.style.display = 'block';
    }
}

function unmuteVideo() {
    video.muted = false;
    video.volume = 1.0;
    unmuteBtn.style.display = 'none';
}

function showPlayerError() {
    clearTimeout(loadTimeout);
    loaderMsg.textContent = "Channel currently offline";
    loaderMsg.classList.add('error');
    loader.style.display = 'flex';
    unmuteBtn.style.display = 'none';
}

function playChannel(channel) {
    stopAll();
    if (!channel) return;

    placeholder.style.display = 'none';
    loader.style.display = 'flex';
    loadTimeout = setTimeout(showPlayerError, 20000); 

    if (channel.type === "hls") {
        video.style.display = "block";
        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(channel.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (e, data) => { if(data.fatal) showPlayerError(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.play();
        }
    } else {
        iframe.style.display = "block";
        iframe.src = channel.url;
        iframe.onload = clearLoader;
    }
}

video.onloadeddata = clearLoader;
video.onplaying = clearLoader;
video.onerror = showPlayerError;

select.addEventListener('change', (e) => playChannel(channelsData[e.target.value]));
</script>
</body>
</html>
