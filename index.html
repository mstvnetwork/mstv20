<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Stream Player - T Sports BD</title>
    <!-- Use HLS.js for cross-browser M3U8 support -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .video-container { width: 80%; max-width: 900px; border: 2px solid #333; }
        video { width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="video-container">
    <video id="video" controls poster="https://abusaeeidx.github.io/Tv-Channel-Logo/CricHD/V2.0/new/tsportsbd.png"></video>
</div>

<script>
    const video = document.getElementById('video');
    const streamUrl = 'https://biz3.dlolcast.com:7059/hls/bdgtv.m3u8?md6=o3q5cyeCQ7SWp1pkBb49Jg&expires=1757519523';
    
    // Check if HLS.js is supported
    if (Hls.isSupported()) {
        const hls = new Hls({
            // Custom loader to handle Referer/Origin if the server allows
            xhrSetup: function (xhr, url) {
                // Note: Standard browsers may block setting 'Referer' or 'Origin' directly
                // This works best if you are running this from the allowed domain or a proxy
                xhr.withCredentials = true; 
            }
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });
    } 
    // For Safari which has native HLS support
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>
</body>
</html>
