<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Site Stream Tester</title>
    <!-- Stable CDN for Video.js CSS -->
    <link href="https://cdn.jsdelivr.net" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #121212; color: white; }
        .controls { margin-bottom: 20px; width: 100%; max-width: 640px; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 6px; background: #1e1e1e; color: white; border: 1px solid #333; }
        button { padding: 10px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .video-container { width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h2>Stream Tester (Proxy Enabled)</h2>
    <div class="controls">
        <input type="text" id="videoUrl" placeholder="Paste URL (Shemaroo, Apne, or Tulnit)...">
        <button onclick="loadVideo()">PLAY</button>
    </div>

    <div class="video-container">
        <video id="my-video" class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" controls preload="auto"></video>
    </div>

    <!-- Stable CDN for Video.js Library -->
    <script src="https://cdn.jsdelivr.net"></script>

    <script>
        // Check if Video.js loaded correctly
        var player;
        try {
            player = videojs('my-video');
        } catch (e) {
            console.error("Video.js failed to initialize:", e);
        }

        function loadVideo() {
            var inputUrl = document.getElementById('videoUrl').value.trim();
            if (!inputUrl) return alert("Please paste a URL");
            if (!player) return alert("Player library not loaded. Check your connection.");

            let finalUrl = inputUrl;

            // Proxy logic to bypass CORS
            if (inputUrl.includes("://airtelapp.shemaroo.com")) {
                finalUrl = inputUrl.replace("https://://airtelapp.shemaroo.com", "/shemaroo/");
            } else if (inputUrl.includes("apne.co/")) {
                finalUrl = inputUrl.replace("https://apne.co", "/apne/");
            } else if (inputUrl.includes("://tulnit.com")) {
                finalUrl = inputUrl.replace("https://://tulnit.com", "/tulnit/");
            }

            console.log("Loading path:", finalUrl);

            var type = finalUrl.includes(".m3u8") ? "application/x-mpegURL" : "video/mp4";
            
            player.src({ src: finalUrl, type: type });
            player.play().catch(e => console.log("Playback failed. Stream might be offline."));
        }
    </script>
</body>
</html>
