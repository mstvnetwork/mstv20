<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>MSTV Network</title>
</head>

<body>

<div class="title-3d">AAINA DTH FREE</div>

<div class="channel-selector-text">Select Channel</div>

<div class="channel-selection">
<select id="channel-select">
<option value="">👉📺📺📺</option>
</select>
</div>

<div class="player-container" id="player-container">
<iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture"
sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>

<video id="video-player" autoplay playsinline muted
disablePictureInPicture controlsList="nodownload nofullscreen noplaybackrate noremoteplayback"
style="object-fit: cover; pointer-events: none;"></video>

<img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png" />
<div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
<div class="loading-indicator" id="loading">Loading stream...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const liveStamp = document.getElementById('live-stamp');

let hlsInstance = null;

/* 🔥 HARDCODED CHANNELS */
const channelsData = [
{
name: "Aaina DTH Main",
url: "https://mstvnetwork.github.io/Aaina-Dth/",
type: "iframe"
},
{
name: "Bollywood Classic",
url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8",
type: "hls"
},
{
name: "Zee Cinema",
url: "https://fscott.sytes.net/zeecinema.html",
type: "iframe"
}
];

/* Populate dropdown once */
function populateChannels() {
select.innerHTML = '<option value="">👉📺📺📺</option>';

channelsData.forEach((channel, index) => {
const option = document.createElement('option');
option.value = index;
option.textContent = channel.name;
select.appendChild(option);
});
}

populateChannels();

/* Default state */
placeholder.style.display = 'block';
videoPlayer.style.display = 'none';
iframePlayer.style.display = 'none';
liveStamp.style.display = 'none';

function showLoading(show) {
loading.style.display = show ? 'block' : 'none';
}

function stopAllPlayback() {
if (hlsInstance) {
hlsInstance.destroy();
hlsInstance = null;
}

videoPlayer.pause();
videoPlayer.removeAttribute('src');
videoPlayer.load();
videoPlayer.style.display = 'none';

iframePlayer.src = '';
iframePlayer.style.display = 'none';

liveStamp.style.display = 'none';
}

function playChannel(channel) {
showLoading(true);
placeholder.style.display = 'none';
stopAllPlayback();

if (!channel || !channel.url) {
placeholder.style.display = 'block';
showLoading(false);
return;
}

if (channel.type === 'hls') {

if (Hls.isSupported()) {
videoPlayer.style.display = 'block';
videoPlayer.muted = false;
videoPlayer.volume = 1;

hlsInstance = new Hls();
hlsInstance.loadSource(channel.url);
hlsInstance.attachMedia(videoPlayer);

hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
videoPlayer.play();
showLoading(false);
});
}
else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
videoPlayer.src = channel.url;
videoPlayer.style.display = 'block';

videoPlayer.play().then(() => {
showLoading(false);
}).catch(() => {
placeholder.style.display = 'block';
showLoading(false);
});
}
else {
placeholder.style.display = 'block';
showLoading(false);
}

liveStamp.style.display = 'none';
}

else if (channel.type === 'iframe') {

let url = channel.url;

if (url.includes("youtube.com") || url.includes("youtu.be")) {
if (!url.includes("embed")) {
const videoId = url.includes("youtu.be")
? url.split("youtu.be/")[1]?.split("?")[0]
: url.split("v=")[1]?.split("&")[0];

if (videoId) {
url = `https://www.youtube.com/embed/${videoId}`;
}
}

const separator = url.includes("?") ? "&" : "?";
if (!url.includes("controls=0")) {
url += `${separator}controls=0`;
}
}

iframePlayer.src = url;
iframePlayer.style.display = 'block';
liveStamp.style.display = 'block';
showLoading(false);
}
}

/* Dropdown change event */
select.addEventListener('change', () => {
const index = select.value;

if (index === '') {
playChannel(null);
} else {
playChannel(channelsData[index]);
}
});
</script>

</body>
</html>
