<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Edge Stream Tester</title>
    
    <!-- FIX: Integrated your HLS.js Library correctly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.20/hls.min.js" integrity="sha512-yQzohCknrQkYGB82MKUj2tk/XxXIH8jthzZpy89adgms47b9ydFW6UK2f3eEXIZm0pe3lbhrWfxZOHuIGHSJ0w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        video { width: 100%; border-radius: 8px; background: black; margin-top: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Netlify Proxy Player</h2>
        <p>Testing: Shemaroo TV (Airtel)</p>
        
        <!-- Input for the original source URL -->
        <input type="text" id="streamUrl" 
               value="https://si.videoapne.to/hls/,bdohxv6a7bboxuzvta574givq2t5iijnzpg4iqkw5bwqgfuxeo3iyr7imfeq,.urlset/master.m3u8">
        <br>
        <button onclick="initPlayer()">Play via Netlify Proxy</button>

        <div id="status">Status: Ready</div>
        <video id="video" controls playsinline></video>
    </div>

    <script>
        function initPlayer() {
            const video = document.getElementById('video');
            const status = document.getElementById('status');
            const rawUrl = document.getElementById('streamUrl').value.trim();
            
            // Your Edge Function endpoint
            const proxyBase = window.location.origin + "/proxy?url=";
            const initialManifest = proxyBase + encodeURIComponent(rawUrl);

            status.innerText = "Connecting to Netlify Edge...";

            if (Hls.isSupported()) {
                const hls = new Hls({
                    // CRITICAL: This intercepts requests for chunks (.ts files) 
                    // and forces them through your Netlify Edge Function
                    xhrSetup: function(xhr, url) {
                        if (!url.includes(window.location.origin)) {
                            const proxiedUrl = proxyBase + encodeURIComponent(url);
                            xhr.open('GET', proxiedUrl, true);
                        }
                    }
                });

                hls.loadSource(initialManifest);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    status.innerText = "Streaming via Edge Proxy...";
                    video.play().catch(e => console.log("Autoplay blocked, user interaction needed."));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error("HLS error:", data);
                    if (data.fatal) {
                        status.innerText = "Error: Proxy unreachable or Stream expired.";
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Support for Safari/iOS
                video.src = initialManifest;
                video.play();
            }
        }
    </script>
</body>
</html>
