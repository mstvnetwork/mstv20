<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>
<script src="https://cdn.jsdelivr.net"></script>
<style>
/* ... (Global Reset and Layout same as previous) ... */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: #E0E0E0; background: #0F1115; }
.title-3d { font-size: clamp(1.8rem, 4vw, 3.5rem); text-align: center; margin: clamp(20px, 5vh, 40px) 0 10px; color: #FFFFFF; letter-spacing: 2px; font-weight: 700; }
.scrolling-news { background: #1A1D20; color: #90EE90; padding: 10px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; font-weight: 500; }
.channel-selector-text { text-align: center; font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 4vh 0 2vh; font-weight: 600; }
.channel-selection { display: flex; justify-content: center; padding: 0 15px; margin-bottom: 5vh; }
select { width: 100%; max-width: 500px; padding: 12px; font-size: clamp(0.9rem, 2vw, 1.2rem); background: #1A1D20; color: #90EE90; border: 1px solid #90EE90; border-radius: 8px; text-align: center; outline: none; cursor: pointer; }
#fullscreen-wrapper { position: relative; width: 95%; max-width: 1200px; margin: 0 auto 30px; background: #000; }
#fullscreen-wrapper:fullscreen { width: 100vw; height: 100vh; max-width: none; margin: 0; }
.player-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #1A1D20; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.player-container::before { content: ""; display: block; padding-top: 56.25%; }
#fullscreen-wrapper:fullscreen .player-container::before { display: none; }
#fullscreen-wrapper:fullscreen .player-container { height: 100%; }
.player-container iframe, .player-container video, #placeholder-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; border: none; }
#blur-overlay { position: absolute; top: 15px; left: 15px; width: 120px; height: 50px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; display: none; pointer-events: none; }
#exit-fs-btn { display: none; position: absolute; top: 20px; right: 20px; z-index: 9999; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.3s ease; }
#exit-fs-btn:hover { background: rgba(229, 9, 20, 0.8); border-color: #ff4d4d; box-shadow: 0 0 20px rgba(229, 9, 20, 0.4); transform: translateY(-1px); }
#fullscreen-wrapper:fullscreen #exit-fs-btn { display: block; }

/* UPDATED LOADER CSS */
.loader-container {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 25; display: none; flex-direction: column; align-items: center; gap: 15px;
}
.spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(144, 238, 144, 0.1);
  border-top: 3px solid #90EE90;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 15px rgba(144, 238, 144, 0.3);
}
.loading-text {
  color: #90EE90; font-size: 14px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase;
  text-shadow: 0 0 8px rgba(144, 238, 144, 0.6);
  animation: fadePulse 1.5s ease-in-out infinite;
}
/* ERROR STATE CSS */
.loading-text.error {
    color: #ff4d4d !important;
    text-shadow: 0 0 8px rgba(255, 77, 77, 0.6) !important;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.fb-follow-container { text-align: center; margin-bottom: 60px; }
.fb-link { display: inline-flex; align-items: center; text-decoration: none; color: #ffffff; background: #1877F2; padding: 10px 20px; border-radius: 50px; font-weight: bold; }
footer { background: #000; color: #888; text-align: center; padding: 40px 20px; border-top: 1px solid #222; }
</style>
</head>
<body>

<div class="title-3d">AAINA DTH FREE</div>
<div class="scrolling-news"><marquee behavior="scroll" direction="left" scrollamount="6">Welcome to MSTV Network!</marquee></div>

<div class="channel-selector-text">Select Channel</div>
<div class="channel-selection">
  <select id="channel-select"><option value="">👉📺📺📺</option></select>
</div>

<div id="fullscreen-wrapper">
    <button id="exit-fs-btn" onclick="exitFullscreen()">EXIT FULLSCREEN</button>
    <div class="player-container">
        <iframe id="media-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
        <video id="video-player" autoplay playsinline controlsList="nodownload"></video>
        <img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">
        <div id="blur-overlay"></div>
        
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <span class="loading-text" id="loader-msg">Please Wait channel loading</span>
        </div>
    </div>
</div>

<div class="fb-follow-container"><a href="https://www.facebook.com" target="_blank" class="fb-link">Follow us on Facebook</a></div>
<footer>&copy; <span id="year"></span> MSTV Network. All Rights Reserved.</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const select = document.getElementById('channel-select'), videoPlayer = document.getElementById('video-player'), iframePlayer = document.getElementById('media-player'), placeholder = document.getElementById('placeholder-image'), loader = document.getElementById('loader'), loaderMsg = document.getElementById('loader-msg'), fsWrapper = document.getElementById('fullscreen-wrapper');

let hlsInstance = null;
let loadTimeout = null; // Timer for error detection

const channelsData = [
    { name: "Aaina DTH Main", url: "https://mstvnetwork.github.io/Aaina-Dth", type: "iframe", showBadge: false },
    { name: "Bollywood Classic", url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8", type: "hls", showBadge: false },
    { name: "Zee Cinema", url: "https://fscott.sytes.net/zeecinema.html", type: "iframe", showBadge: true }
];

channelsData.forEach((ch, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = ch.name; select.appendChild(opt); });

function showPlayerError() {
    clearTimeout(loadTimeout);
    loaderMsg.textContent = "Channel currently offline";
    loaderMsg.classList.add('error');
    // We keep the loader visible so they see the error
}

function clearLoader() {
    clearTimeout(loadTimeout);
    loader.style.display = 'none';
    loaderMsg.textContent = "Please Wait channel loading";
    loaderMsg.classList.remove('error');
}

function playChannel(channel) {
    clearLoader();
    if (!channel) { placeholder.style.display = 'block'; return; }
    
    loader.style.display = 'flex';
    placeholder.style.display = 'none';
    
    // Start 10-second fail timer
    loadTimeout = setTimeout(showPlayerError, 10000); 

    if (channel.type === "hls") {
        videoPlayer.style.display = "block";
        if (Hls.isSupported()) {
            if (hlsInstance) hlsInstance.destroy();
            hlsInstance = new Hls();
            hlsInstance.loadSource(channel.url);
            hlsInstance.attachMedia(videoPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoPlayer.play());
            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) showPlayerError();
            });
        }
    } else {
        iframePlayer.src = channel.url;
        iframePlayer.style.display = "block";
        iframePlayer.onload = clearLoader;
    }
}

// Clear loader when video actually starts playing
videoPlayer.onplaying = clearLoader;
videoPlayer.onerror = showPlayerError;

select.addEventListener('change', (e) => playChannel(channelsData[e.target.value]));
function exitFullscreen() { if (document.exitFullscreen) document.exitFullscreen(); }
</script>
</body>
</html>
