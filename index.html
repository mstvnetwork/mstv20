<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTV Network</title>

<style>

/* ===== Global Reset ===== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  color: #E0E0E0;
  background: #0F1115;
}

/* ===== Fluid Title ===== */

.title-3d {
  font-size: clamp(1.8rem, 4vw, 3.5rem);
  text-align: center;
  margin: clamp(20px, 5vh, 50px) 0 30px;
  color: #FFFFFF;
  letter-spacing: 2px;
  font-weight: 700;
}

/* ===== Selector Text ===== */

.channel-selector-text {
  text-align: center;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  margin: 4vh 0 2vh;
  font-weight: 600;
}

/* ===== Dropdown ===== */

.channel-selection {
  display: flex;
  justify-content: center;
  padding: 0 15px;
  margin-bottom: 5vh;
}

select {
  width: 100%;
  max-width: 500px;
  padding: 12px;
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  background: #1A1D20;
  color: #90EE90;
  border: 1px solid #90EE90;
  border-radius: 8px;
  text-align: center;
  outline: none;
  cursor: pointer;
}

/* ===== Responsive Player ===== */

.player-container {
  position: relative;
  width: 95%;
  max-width: 1200px;
  margin: 0 auto 60px;
  border-radius: 12px;
  overflow: hidden;
  background: #1A1D20;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* 16:9 universal ratio */
.player-container::before {
  content: "";
  display: block;
  padding-top: 56.25%;
}

/* Media fills container */
.player-container iframe,
.player-container video,
#placeholder-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ===== Live Badge ===== */

.live-stamp {
  position: absolute;
  top: 15px;
  left: 15px;
  background: #E50914;
  color: white;
  font-weight: 700;
  font-size: clamp(12px, 1.5vw, 18px);
  padding: 6px 14px;
  border-radius: 6px;
  z-index: 10;
}

/* ===== Loading ===== */

.loading-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.7);
  color: #90EE90;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: clamp(0.8rem, 2vw, 1.1rem);
  display: none;
  z-index: 20;
}

/* ===== Large Screen Adjustment ===== */

@media (min-width: 1600px) {
  .player-container {
    max-width: 1400px;
  }
}

/* ===== Small Screen Adjustment ===== */

@media (max-width: 480px) {
  .player-container {
    width: 100%;
    border-radius: 0;
  }
}

</style>
</head>

<body>

<div class="title-3d">AAINA DTH FREE</div>

<div class="channel-selector-text">Select Channel</div>

<div class="channel-selection">
<select id="channel-select">
<option value="">👉📺📺📺</option>
</select>
</div>

<div class="player-container">

<iframe id="media-player"
allow="autoplay; encrypted-media; picture-in-picture"
sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>

<video id="video-player"
autoplay playsinline muted
disablePictureInPicture
controlsList="nodownload nofullscreen noplaybackrate noremoteplayback"
style="pointer-events:none;"></video>

<img id="placeholder-image" src="Design-Studio-2025-01-22 (1).png">

<div class="live-stamp" id="live-stamp">MSTV NETWORK</div>
<div class="loading-indicator" id="loading">Loading stream...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const select = document.getElementById('channel-select');
const videoPlayer = document.getElementById('video-player');
const iframePlayer = document.getElementById('media-player');
const placeholder = document.getElementById('placeholder-image');
const loading = document.getElementById('loading');
const liveStamp = document.getElementById('live-stamp');

let hlsInstance = null;

const channelsData = [
{
name: "Aaina DTH Main",
url: "https://mstvnetwork.github.io/Aaina-Dth/",
type: "iframe"
},
{
name: "Bollywood Classic",
url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8",
type: "hls"
},
{
name: "Zee Cinema",
url: "https://fscott.sytes.net/zeecinema.html",
type: "iframe"
}
];

channelsData.forEach((channel, index) => {
const option = document.createElement('option');
option.value = index;
option.textContent = channel.name;
select.appendChild(option);
});

placeholder.style.display = 'block';
videoPlayer.style.display = 'none';
iframePlayer.style.display = 'none';
liveStamp.style.display = 'none';

function showLoading(show) {
loading.style.display = show ? 'block' : 'none';
}

function stopAllPlayback() {
if (hlsInstance) {
hlsInstance.destroy();
hlsInstance = null;
}
videoPlayer.pause();
videoPlayer.removeAttribute('src');
videoPlayer.load();
videoPlayer.style.display = 'none';
iframePlayer.src = '';
iframePlayer.style.display = 'none';
liveStamp.style.display = 'none';
}

function playChannel(channel) {

showLoading(true);
stopAllPlayback();
placeholder.style.display = 'none';

if (!channel) {
placeholder.style.display = 'block';
showLoading(false);
return;
}

if (channel.type === "hls") {

if (Hls.isSupported()) {
videoPlayer.style.display = "block";
videoPlayer.muted = false;

hlsInstance = new Hls();
hlsInstance.loadSource(channel.url);
hlsInstance.attachMedia(videoPlayer);

hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
videoPlayer.play();
showLoading(false);
});
}
else {
videoPlayer.src = channel.url;
videoPlayer.style.display = "block";
videoPlayer.play();
showLoading(false);
}

liveStamp.style.display = "none";
}

else {

iframePlayer.src = channel.url;
iframePlayer.style.display = "block";
liveStamp.style.display = "block";
showLoading(false);
}
}

select.addEventListener("change", () => {
const index = select.value;
if (index === "") {
playChannel(null);
} else {
playChannel(channelsData[index]);
}
});

</script>

</body>
</html>
