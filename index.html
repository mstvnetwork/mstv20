<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Network | Unified Player</title>
    <script src="shaka.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #stage { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
        video, iframe { width: 100%; height: 100%; border: none; display: none; }
        #overlay { position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.4); font-size: 11px; z-index: 20; pointer-events: none; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="overlay">MSTV SYSTEM v2.0</div>
        <video id="video" controls autoplay crossorigin="anonymous"></video>
        <iframe id="external-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <script>
        // --- CHANNEL LIST (1, 2, 3...) ---
        const channels = {
            "1": {
                name: "Zee TV",
                url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd",
                type: "shaka",
                drm: { 'ed068cf84f0640ccbc7c0e395c0a272e': 'bb722190f2bb446391020411a7d0828b' }
            },
            "2": {
                name: "Bollywood Classic",
                url: "https://d35j504z0x2vu2.cloudfront.net/v1/manifest/0bc8e8376bd8417a1b6761138aa41c26c7309312/bollywood-classic/6b126777-7e9a-444f-9845-48fa1d4ed694/1.m3u8",
                type: "shaka"
            },
            "3": {
                name: "Star Sports",
                url: "https://streamcrichd.com/update/star.php",
                type: "iframe"
            }
        };

        let player;
        const video = document.getElementById('video');
        const iframe = document.getElementById('external-frame');
        const overlay = document.getElementById('overlay');

        async function initApp() {
            if (typeof shaka === 'undefined') {
                overlay.innerText = "Error: shaka.js Missing";
                return;
            }

            shaka.polyfill.installAll();
            player = new shaka.Player(video);

            // Surity Headers
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Origin'] = 'https://www.zee5.com';
                request.headers['Referer'] = 'https://www.zee5.com';
            });

            // --- SMART URL PICKER ---
            // This looks for anything after the "?" (e.g. ?1 or ?2)
            const query = window.location.search.substring(1); 
            const chId = query || "1"; // Default to 1 if just /mstv6/ is visited

            loadChannel(chId);
        }

        async function loadChannel(id) {
            const ch = channels[id];
            if (!ch) {
                overlay.innerText = "Channel " + id + " Not Found";
                return;
            }

            overlay.innerText = "MSTV NETWORK | " + ch.name;

            if (ch.type === "shaka") {
                iframe.style.display = "none";
                iframe.src = "";
                video.style.display = "block";

                player.resetConfiguration();
                if (ch.drm) {
                    player.configure({ drm: { clearKeys: ch.drm } });
                }

                try {
                    await player.load(ch.url);
                } catch (e) { console.error("Error", e); }
            } else {
                video.style.display = "none";
                player.unload();
                iframe.style.display = "block";
                iframe.src = ch.url;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
