<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Stream Tester</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #121212; color: white; }
        .controls { margin-bottom: 20px; width: 100%; max-width: 640px; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border-radius: 6px; background: #1e1e1e; color: white; border: 1px solid #333; }
        button { padding: 10px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .video-container { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <h2>Stream Tester (HLS.js Edition)</h2>
    <div class="controls">
        <input type="text" id="videoUrl" placeholder="Paste URL (Shemaroo, Apne, Tulnit)...">
        <button onclick="loadVideo()">PLAY</button>
    </div>

    <div class="video-container">
        <video id="video" controls></video>
    </div>

    <!-- Using a very stable CDN for HLS.js -->
    <script src="hls.min.js"></script>


    <script>
        var video = document.getElementById('video');
        var hls = new Hls();

        function loadVideo() {
            var inputUrl = document.getElementById('videoUrl').value.trim();
            if (!inputUrl) return alert("Please paste a URL");
            if (typeof Hls === 'undefined') return alert("HLS library failed to load. Check your internet.");

            let finalUrl = inputUrl;

            // Apply Netlify Proxy Logic
            if (inputUrl.includes("://airtelapp.shemaroo.com")) {
                finalUrl = inputUrl.replace("https://://airtelapp.shemaroo.com", "/shemaroo/");
            } else if (inputUrl.includes("apne.co/")) {
                finalUrl = inputUrl.replace("https://apne.co", "/apne/");
            } else if (inputUrl.includes("://tulnit.com")) {
                finalUrl = inputUrl.replace("https://://tulnit.com", "/tulnit/");
            }

            console.log("Loading URL:", finalUrl);

            if (Hls.isSupported()) {
                hls.destroy(); // Clear previous stream
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For Safari
                video.src = finalUrl;
                video.play();
            }
        }
    </script>
</body>
</html>
