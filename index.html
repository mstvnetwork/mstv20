<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwi Stream Tester</title>
    <!-- Include HLS.js Library -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 800px; border: 2px solid #444; border-radius: 8px; background: black; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { color: #e74c3c; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>M3U8 Stream Tester</h2>
    
    <input type="text" id="streamUrl" placeholder="Paste your .m3u8 link here..." 
           value="https://airtelagp.shemaroo.com">
    <br>
    <button onclick="loadStream()">Play Stream</button>

    <div id="status"></div>
    <br>
    <video id="video" controls></video>

    <script>
        function loadStream() {
            var video = document.getElementById('video');
            var url = document.getElementById('streamUrl').value.trim();
            var status = document.getElementById('status');
            status.innerText = "";

            if (!url) {
                status.innerText = "Error: Please paste a URL.";
                return;
            }

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        status.innerText = "Stream Error: Likely a CORS or Referer block.";
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For Safari/iOS which supports HLS natively
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                status.innerText = "Error: Your browser does not support HLS.";
            }
        }
    </script>
</body>
</html>
